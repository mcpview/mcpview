name: Publish

# Triggered on push to main. Publishes the six `@mcpview/*` packages and the
# seven deprecated `@casys/*` aliases (packages/legacy/) to npm and JSR. Each
# npm job is idempotent: it checks `npm view <pkg>@<ver>` before publishing so
# already-published versions exit cleanly without masking auth/build/network
# failures.
#
# Publication order follows the dependency graph:
#
#   contracts -> server -> view -> components -> compose -> bridge -> aliases
#
#   npm   view family (contracts -> view -> components, one job so the family
#         is verified and guarded as a unit), server, compose, and bridge run
#         first; the alias job needs all four because every alias smoke test
#         installs its target from the registry.
#   JSR   one sequential job, in the order above. It waits for every npm job of
#         the six packages, so a failed content guard stops both registries; the
#         aliases publish last, in their own job.
#
# Guards kept from the single-scope setup: published npm versions are immutable
# (the view family compares the rebuilt tarballs with the registry copies and
# refuses a silent rewrite), and every alias is smoke-tested against both the
# newest compatible target and the declared lower bound of its range.

on:
  push:
    branches: [main]

jobs:
  publish-npm-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @mcpview/server to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/server
          deno task build:npm

          PACK_DIR=$(mktemp -d)
          TARBALL_NAME=$(npm pack ./dist-node --pack-destination "$PACK_DIR" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE' >/dev/null
          tar -tzf "$TARBALL" | grep -Fx 'package/README.md' >/dev/null
          tar -tzf "$TARBALL" | grep -Fx 'package/CHANGELOG.md' >/dev/null
          # ESM-only output: without "type": "module" the .js entry parses as
          # CommonJS on Node <20.19 (engines floor is >=20). The node@20 smoke
          # run below cannot catch it (latest 20.x detects module syntax), so
          # assert the field directly.
          node -p "require('./dist-node/package.json').type" | grep -Fx 'module' >/dev/null

          CONSUMER_DIR=$(mktemp -d)
          (
            cd "$CONSUMER_DIR"
            npm init --yes >/dev/null
            npm pkg set type=module
            npm install --ignore-scripts --no-audit --no-fund "$TARBALL" typescript@5.9.3 @types/node@22
          )

          npx --yes node@20 scripts/smoke-node.mjs "$CONSUMER_DIR/node_modules/@mcpview/server/esm/mod.js"
          node scripts/smoke-node.mjs "$CONSUMER_DIR/node_modules/@mcpview/server/esm/mod.js"
          cp scripts/smoke-node-consumer.ts "$CONSUMER_DIR/smoke-node-consumer.ts"
          (
            cd "$CONSUMER_DIR"
            node --input-type=module --eval 'const pkg = await import("@mcpview/server"); if (typeof pkg.McpApp !== "function") throw new Error("package export missing")'
            npx tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM,DOM.Iterable smoke-node-consumer.ts
          )

          PKG_NAME=$(node -p "require('./dist-node/package.json').name")
          PKG_VERSION=$(node -p "require('./dist-node/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish ./dist-node --dry-run --access public
          npm publish ./dist-node --access public

  publish-npm-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @mcpview/compose to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/compose
          deno run -A scripts/build-npm.ts

          PACK_DIR=$(mktemp -d)
          TARBALL_NAME=$(npm pack ./dist-node --pack-destination "$PACK_DIR" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')
          TARBALL="$PACK_DIR/$TARBALL_NAME"
          for REQUIRED in package/LICENSE package/README.md package/CHANGELOG.md; do
            tar -tzf "$TARBALL" | grep -Fx "$REQUIRED" >/dev/null
          done

          cd dist-node
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish --access public

  publish-npm-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build and publish @mcpview/bridge to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/bridge
          deno run -A scripts/build-npm.ts
          cd dist-node
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish --access public

  publish-npm-aliases:
    # Each alias installs its target from the npm registry during its smoke
    # test, so the four jobs that publish the six @mcpview/* packages go first.
    needs:
      - publish-npm-view-family
      - publish-npm-server
      - publish-npm-compose
      - publish-npm-bridge
    runs-on: ubuntu-latest
    strategy:
      # Aliases are independent of one another: keep going so one failure does
      # not hide the state of the others. max-parallel 1 publishes them in the
      # order listed.
      fail-fast: false
      max-parallel: 1
      matrix:
        alias:
          - mcp-server
          - mcp-platform
          - mcp-view-contracts
          - mcp-view
          - mcp-view-components
          - mcp-compose
          - mcp-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build, verify, and publish the @casys/${{ matrix.alias }} alias to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "packages/legacy/${{ matrix.alias }}"
          deno task build:npm

          # Tarball contents, manifest deprecation notice, ESM/CJS entry-point
          # parity with the target for every sub-path, a strict NodeNext type
          # check, then the same against the declared lower bound of the
          # dependency range (the target is installed from the registry).
          deno run -A ../../../scripts/verify-alias-npm.ts

          PKG_NAME=$(node -p "require('./dist-node/package.json').name")
          PKG_VERSION=$(node -p "require('./dist-node/package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            exit 0
          fi
          npm publish ./dist-node --dry-run --access public
          npm publish ./dist-node --access public

  publish-npm-view-family:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify npm credentials
        # Runs BEFORE the version check below, deliberately. That check exits 0
        # when the version is already published — so on a run where nothing needs
        # publishing, a dead NPM_TOKEN is never exercised and the job goes green.
        # That is not hypothetical: the token was invalid for two weeks while
        # every run passed, because no version happened to move.
        # `npm whoami` fails on a bad token regardless of what is published.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # One call, reused. Note this proves the token authenticates, not that
          # it carries publish rights on this scope — npm has no cheap check for
          # that. It still separates "nothing to publish" from "cannot publish",
          # which the version check below cannot do.
          if ! WHO=$(npm whoami --registry https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN did not authenticate: ${WHO}"
            echo "If this is a credential failure, note npm answers 404 (not 401)"
            echo "on a scoped package, so a later publish would look like a"
            echo "missing package rather than an auth problem."
            exit 1
          fi
          echo "npm authenticated as ${WHO}"
      - name: Build, verify, and publish the view package family
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          (cd packages/view-contracts && deno task build:npm)
          (cd packages/view && deno task build:npm)
          (cd packages/view-components && deno task build:npm)

          PACK_DIR=$(mktemp -d)
          CONTRACTS_TARBALL=$(npm pack ./packages/view-contracts/dist-node --pack-destination "$PACK_DIR" --json | node -p 'require("path").join(process.argv[1], JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)' "$PACK_DIR")
          VIEW_TARBALL=$(npm pack ./packages/view/dist-node --pack-destination "$PACK_DIR" --json | node -p 'require("path").join(process.argv[1], JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)' "$PACK_DIR")
          COMPONENTS_TARBALL=$(npm pack ./packages/view-components/dist-node --pack-destination "$PACK_DIR" --json | node -p 'require("path").join(process.argv[1], JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)' "$PACK_DIR")

          for TARBALL in "$CONTRACTS_TARBALL" "$VIEW_TARBALL" "$COMPONENTS_TARBALL"; do
            tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE' >/dev/null
            tar -tzf "$TARBALL" | grep -Fx 'package/README.md' >/dev/null
          done
          if tar -tzf "$COMPONENTS_TARBALL" | grep -E '^package/(esm|script|src)/.*scaffold' >/dev/null; then
            echo "::error::The npm components tarball must not ship the Deno-only scaffold"
            exit 1
          fi
          if tar -tzf "$COMPONENTS_TARBALL" | grep -E '^package/(esm|script|src)/.*/testing/' >/dev/null; then
            echo "::error::The npm components tarball must not ship the test doubles"
            exit 1
          fi

          CORE_CONSUMER_DIR=$(mktemp -d)
          (
            cd "$CORE_CONSUMER_DIR"
            npm init --yes >/dev/null
            npm pkg set type=module
            npm install --ignore-scripts --no-audit --no-fund \
              "$CONTRACTS_TARBALL" "$VIEW_TARBALL"
            node --input-type=module --eval '
              import { readFileSync } from "node:fs";
              const core = await import("@mcpview/view");
              const contracts = await import("@mcpview/view/contracts");
              if (typeof core.createMcpApp !== "function" ||
                  "installMcpViewTheme" in core ||
                  "defineComponentRegistry" in core ||
                  "scaffoldResultViewer" in core) {
                throw new Error("core-only ESM boundary invalid");
              }
              if (contracts.VIEWER_SESSION_APPLY_ACTION !== "viewer.session.apply") {
                throw new Error("core-only ESM contracts export missing");
              }
              const installedPaths = Object.keys(
                JSON.parse(readFileSync("package-lock.json", "utf8")).packages ?? {},
              );
              for (const dependency of ["preact", "@mcpview/components"]) {
                if (installedPaths.some((path) =>
                  path === `node_modules/${dependency}` || path.endsWith(`/node_modules/${dependency}`)
                )) {
                  throw new Error(`core-only consumer installed ${dependency}`);
                }
              }
              for (const subpath of [
                "@mcpview/view/preact",
                "@mcpview/view/preact/components",
                "@mcpview/view/scaffold",
              ]) {
                let rejected = false;
                try {
                  await import(subpath);
                } catch (error) {
                  if (error?.code !== "ERR_PACKAGE_PATH_NOT_EXPORTED") throw error;
                  rejected = true;
                }
                if (!rejected) throw new Error(`removed core UI subpath is still exported: ${subpath}`);
              }
            '
            node --input-type=commonjs --eval '
              const core = require("@mcpview/view");
              const contracts = require("@mcpview/view/contracts");
              if (typeof core.createMcpApp !== "function" ||
                  "installMcpViewTheme" in core ||
                  "defineComponentRegistry" in core ||
                  "scaffoldResultViewer" in core) {
                throw new Error("core-only CommonJS boundary invalid");
              }
              if (contracts.VIEWER_SESSION_APPLY_ACTION !== "viewer.session.apply") {
                throw new Error("core-only CommonJS contracts export missing");
              }
              for (const subpath of [
                "@mcpview/view/preact",
                "@mcpview/view/preact/components",
                "@mcpview/view/scaffold",
              ]) {
                let rejected = false;
                try {
                  require(subpath);
                } catch (error) {
                  if (error?.code !== "ERR_PACKAGE_PATH_NOT_EXPORTED") throw error;
                  rejected = true;
                }
                if (!rejected) throw new Error(`removed core UI subpath is still exported: ${subpath}`);
              }
            '
          )

          CONSUMER_DIR=$(mktemp -d)
          (
            cd "$CONSUMER_DIR"
            npm init --yes >/dev/null
            npm pkg set type=module
            npm install --ignore-scripts --no-audit --no-fund \
              "$CONTRACTS_TARBALL" "$VIEW_TARBALL" "$COMPONENTS_TARBALL" \
              preact@10.28.3 react@18.3.1 react-dom@18.3.1
            node --input-type=module --eval '
              const contracts = await import("@mcpview/contracts");
              const core = await import("@mcpview/view");
              const compatibility = await import("@mcpview/view/contracts");
              const components = await import("@mcpview/components");
              const surface = await import("@mcpview/components/surface");
              const preact = await import("@mcpview/components/preact");
              const presentation = await import("@mcpview/components/preact/components");
              const fonts = await import("@mcpview/components/fonts");
              const layout = await import("@mcpview/components/layout");
              if (typeof contracts.defineViewAppManifest !== "function") throw new Error("contracts missing");
              if (typeof core.createMcpApp !== "function" || "installMcpViewTheme" in core) throw new Error("core boundary invalid");
              if (compatibility.VIEWER_SESSION_APPLY_ACTION !== "viewer.session.apply") throw new Error("compatibility export missing");
              if (typeof components.defineComponentRegistry !== "function") throw new Error("components runtime missing");
              if (typeof surface.startSurfaceApp !== "function" || "startSurfaceApp" in components) throw new Error("surface App boundary invalid");
              if (typeof preact.startPreactSurfaceApp !== "function") throw new Error("Preact runtime missing");
              if (typeof presentation.Card !== "function" || "createMcpApp" in presentation) throw new Error("presentation boundary invalid");
              if (typeof fonts.installMcpViewFonts !== "function" || !fonts.MCP_VIEW_FONTS_CSS.includes("@font-face") || "MCP_VIEW_FONTS_CSS" in components) throw new Error("fonts boundary invalid");
              if (typeof layout.resolveViewerLayout !== "function" || typeof layout.useViewerLayout !== "function" || "useViewerLayout" in components) throw new Error("layout boundary invalid");
              let scaffoldRejected = false;
              try {
                await import("@mcpview/components/scaffold");
              } catch (error) {
                if (error?.code !== "ERR_PACKAGE_PATH_NOT_EXPORTED") throw error;
                scaffoldRejected = true;
              }
              if (!scaffoldRejected) throw new Error("Deno-only scaffold leaked into npm ESM exports");
            '
            node --input-type=commonjs --eval '
              const components = require("@mcpview/components");
              const surface = require("@mcpview/components/surface");
              const preact = require("@mcpview/components/preact");
              const presentation = require("@mcpview/components/preact/components");
              const fonts = require("@mcpview/components/fonts");
              const layout = require("@mcpview/components/layout");
              if (typeof components.defineComponentRegistry !== "function") throw new Error("CommonJS components runtime missing");
              if (typeof surface.startSurfaceApp !== "function") throw new Error("CommonJS surface App runtime missing");
              if (typeof preact.startPreactSurfaceApp !== "function") throw new Error("CommonJS Preact runtime missing");
              if (typeof presentation.Card !== "function") throw new Error("CommonJS presentation runtime missing");
              if (typeof fonts.installMcpViewFonts !== "function") throw new Error("CommonJS fonts entry missing");
              if (typeof layout.resolveViewerLayout !== "function" || typeof layout.useViewerLayout !== "function") throw new Error("CommonJS layout entry missing");
              let scaffoldRejected = false;
              try {
                require("@mcpview/components/scaffold");
              } catch (error) {
                if (error?.code !== "ERR_PACKAGE_PATH_NOT_EXPORTED") throw error;
                scaffoldRejected = true;
              }
              if (!scaffoldRejected) throw new Error("Deno-only scaffold leaked into npm CommonJS exports");
            '
          )

          assert_published_version_matches() {
            PACKAGE_DIR=$1
            LOCAL_TARBALL=$2
            PKG_NAME=$(node -p "require('./' + process.argv[1] + '/package.json').name" "$PACKAGE_DIR")
            PKG_VERSION=$(node -p "require('./' + process.argv[1] + '/package.json').version" "$PACKAGE_DIR")
            if ! npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              return
            fi

            REMOTE_PACK_DIR=$(mktemp -d)
            REMOTE_TARBALL=$(npm pack "${PKG_NAME}@${PKG_VERSION}" --pack-destination "$REMOTE_PACK_DIR" --json | node -p 'require("path").join(process.argv[1], JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)' "$REMOTE_PACK_DIR")
            LOCAL_UNPACK_DIR=$(mktemp -d)
            REMOTE_UNPACK_DIR=$(mktemp -d)
            tar -xzf "$LOCAL_TARBALL" -C "$LOCAL_UNPACK_DIR"
            tar -xzf "$REMOTE_TARBALL" -C "$REMOTE_UNPACK_DIR"
            if ! diff -qr "$LOCAL_UNPACK_DIR/package" "$REMOTE_UNPACK_DIR/package" >/dev/null; then
              echo "::error::${PKG_NAME}@${PKG_VERSION} already exists with different contents. Authorize and apply a coordinated view-family version bump before publishing."
              exit 1
            fi
          }

          # Check the complete family before publishing any missing member.
          # This makes retries safe while refusing an unpublished local rewrite
          # of an immutable version (notably the already-published view core).
          assert_published_version_matches packages/view-contracts/dist-node "$CONTRACTS_TARBALL"
          assert_published_version_matches packages/view/dist-node "$VIEW_TARBALL"
          assert_published_version_matches packages/view-components/dist-node "$COMPONENTS_TARBALL"

          publish_if_missing() {
            PACKAGE_DIR=$1
            PKG_NAME=$(node -p "require('./' + process.argv[1] + '/package.json').name" "$PACKAGE_DIR")
            PKG_VERSION=$(node -p "require('./' + process.argv[1] + '/package.json').version" "$PACKAGE_DIR")
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "Already published: ${PKG_NAME}@${PKG_VERSION} — skipping"
            else
              npm publish "$PACKAGE_DIR" --dry-run --access public
              npm publish "$PACKAGE_DIR" --access public
            fi
          }

          publish_if_missing packages/view-contracts/dist-node
          publish_if_missing packages/view/dist-node
          publish_if_missing packages/view-components/dist-node

  publish-jsr:
    # Waits for every npm job of the six packages. The view-family job performs
    # the immutable-version content guard; keeping JSR behind it means a stale
    # core version cannot publish only some of the packages on either registry.
    needs:
      - publish-npm-view-family
      - publish-npm-server
      - publish-npm-compose
      - publish-npm-bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      # `deno publish` rather than `npx jsr publish`: the jsr CLI treats a
      # directory with a package.json (packages/bridge has one) as a Node
      # project and silently adds --no-check and the sloppy-imports flags.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # One package per step, in dependency order, so that every dependency is
      # on the registry before its dependents: view needs contracts, and
      # components needs both. Already-published versions are skipped
      # automatically, which keeps reruns safe.
      - name: Publish @mcpview/contracts to JSR
        run: cd packages/view-contracts && deno publish
      - name: Publish @mcpview/server to JSR
        run: cd packages/server && deno publish
      - name: Publish @mcpview/view to JSR
        run: cd packages/view && deno publish
      - name: Publish @mcpview/components to JSR
        run: cd packages/view-components && deno publish
      - name: Publish @mcpview/compose to JSR
        run: cd packages/compose && deno publish
      - name: Publish @mcpview/bridge to JSR
        run: cd packages/bridge && deno publish

  publish-jsr-aliases:
    # The aliases depend on the six packages above (published to JSR in the
    # previous job) and on their own npm publication.
    needs:
      - publish-jsr
      - publish-npm-aliases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Each @casys/* package must be linked to this repository on JSR for
      # OIDC publishing to be accepted.
      - name: Publish @casys/mcp-server to JSR
        run: cd packages/legacy/mcp-server && deno publish
      - name: Publish @casys/mcp-platform to JSR
        run: cd packages/legacy/mcp-platform && deno publish
      - name: Publish @casys/mcp-view-contracts to JSR
        run: cd packages/legacy/mcp-view-contracts && deno publish
      - name: Publish @casys/mcp-view to JSR
        run: cd packages/legacy/mcp-view && deno publish
      - name: Publish @casys/mcp-view-components to JSR
        run: cd packages/legacy/mcp-view-components && deno publish
      - name: Publish @casys/mcp-compose to JSR
        run: cd packages/legacy/mcp-compose && deno publish
      - name: Publish @casys/mcp-bridge to JSR
        run: cd packages/legacy/mcp-bridge && deno publish
