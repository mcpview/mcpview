name: Release

# Triggered when a scoped tag matching `<package>-v<version>` is pushed.
# Creates a GitHub Release with the matching CHANGELOG section as the body.
# Publishing to JSR/npm is still handled by `publish.yml` on push to main —
# this workflow only handles the human-facing GitHub Release artefact.
#
# Tag prefixes: the six `@mcpview/*` packages use their directory name under
# `packages/` (server, view, ...), and the seven deprecated `@casys/*` aliases
# in `packages/legacy/` use their old name without the scope (mcp-server,
# mcp-platform, mcp-view, ...). `scripts/release-tag.ts` creates these tags.

on:
  push:
    tags:
      - "server-v*"
      - "compose-v*"
      - "bridge-v*"
      - "view-v*"
      - "view-contracts-v*"
      - "view-components-v*"
      - "mcp-server-v*"
      - "mcp-platform-v*"
      - "mcp-view-v*"
      - "mcp-view-contracts-v*"
      - "mcp-view-components-v*"
      - "mcp-compose-v*"
      - "mcp-bridge-v*"

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # `<pkg>-v<version>` → split on the last `-v` (`view-components-v0.6.0`)
          pkg="${TAG%-v*}"
          version="${TAG##*-v}"
          if [[ -z "$pkg" || -z "$version" ]]; then
            echo "::error::Cannot parse tag as <pkg>-v<version>"
            exit 1
          fi
          # `mcp-*` prefixes are the deprecated aliases in packages/legacy/.
          if [[ -f "packages/${pkg}/CHANGELOG.md" ]]; then
            dir="packages/${pkg}"
          elif [[ -f "packages/legacy/${pkg}/CHANGELOG.md" ]]; then
            dir="packages/legacy/${pkg}"
          else
            echo "::error::No CHANGELOG.md under packages/${pkg} or packages/legacy/${pkg}"
            exit 1
          fi
          {
            echo "pkg=${pkg}"
            echo "version=${version}"
            echo "dir=${dir}"
            echo "changelog=${dir}/CHANGELOG.md"
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        env:
          CHANGELOG_FILE: ${{ steps.parse.outputs.changelog }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          # Print the section between `## [<version>]` and the next `## [`.
          awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" v "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' "$CHANGELOG_FILE" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::No section for version found in changelog"
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of release notes"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PKG_DIR: ${{ steps.parse.outputs.dir }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          # The release title is the published package name, read from its manifest.
          PKG_NAME=$(jq -r .name "${PKG_DIR}/deno.json")
          gh release create "$TAG" \
            --title "${PKG_NAME} ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
